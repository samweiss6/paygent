version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Cooling-off period: don't propose versions younger than two weeks.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # Types must match the supported runtime (Node 24); bump together with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 14
