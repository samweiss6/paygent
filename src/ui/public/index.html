<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Paygent</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar glass">
    <div class="brand">
      <img src="/icon.svg" alt="" width="28" height="28">
      <span class="wordmark">Paygent</span>
      <span class="badge badge-test" title="No real money moves in v0.1">Test mode</span>
    </div>
    <div class="topbar-right">
      <span id="conn" class="conn" role="status" aria-live="polite">Connecting…</span>
      <button id="kill" class="btn btn-danger" type="button">Kill switch</button>
    </div>
  </header>

  <main id="app" class="layout" aria-busy="true">
    <section class="stats" aria-label="Spending">
      <article class="glass stat" id="stat-today"></article>
      <article class="glass stat" id="stat-month"></article>
      <article class="glass stat" id="stat-funding"></article>
      <article class="glass stat" id="stat-state"></article>
    </section>

    <section class="glass panel" aria-labelledby="h-pending">
      <div class="panel-head">
        <h2 id="h-pending">Waiting for you</h2>
        <span class="count" id="pending-count"></span>
      </div>
      <div id="pending"></div>
    </section>

    <section class="glass panel" aria-labelledby="h-payments">
      <div class="panel-head"><h2 id="h-payments">Payments</h2></div>
      <div class="table-wrap"><table id="payments"></table></div>
    </section>

    <section class="glass panel" aria-labelledby="h-policy">
      <div class="panel-head">
        <h2 id="h-policy">Limits and rules</h2>
        <span class="hint">Changes need your owner passphrase</span>
      </div>
      <form id="policy" novalidate></form>
    </section>

    <section class="glass panel" aria-labelledby="h-audit">
      <div class="panel-head">
        <h2 id="h-audit">Audit log</h2>
        <span id="audit-verify" class="hint"></span>
      </div>
      <ol id="audit" class="audit"></ol>
    </section>
  </main>

  <dialog id="sheet" class="sheet glass">
    <form method="dialog" id="sheet-form">
      <h3 id="sheet-title"></h3>
      <div id="sheet-body"></div>
      <label class="field" id="pass-field">
        <span>Owner passphrase</span>
        <input id="pass" type="password" autocomplete="current-password" minlength="12" required>
      </label>
      <p id="sheet-error" class="error" role="alert"></p>
      <div class="sheet-actions">
        <button value="cancel" class="btn btn-ghost" type="button" id="sheet-cancel">Cancel</button>
        <button value="ok" class="btn btn-primary" id="sheet-ok" type="submit"></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">The Paygent dashboard needs JavaScript. The CLI does everything the dashboard does: run <code>paygent help</code>.</p></noscript>
</body>
</html>
